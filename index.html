<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizalooo - إدارة المبيعات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Parastoo & Rubik -->
    <link href="https://fonts.googleapis.com/css2?family=Parastoo:wght@400;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Parastoo', 'Rubik', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- شاشة التحميل / الواجهة -->
    <div id="app" class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- هيدر المتجر والشعار -->
        <header class="flex flex-col sm:flex-row items-center justify-between bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl mb-6 gap-4">
            <div class="flex items-center gap-4">
                <div id="storeLogoContainer" class="w-16 h-16 rounded-full overflow-hidden border-2 border-amber-500 bg-gray-800 flex items-center justify-center shadow-md">
                    <!-- سيتم وضع الشعار هنا برمجياً -->
                    <span class="text-2xl">🍕</span>
                </div>
                <div>
                    <h1 id="storeNameDisplay" class="text-2xl font-bold text-amber-400">pizalo</h1>
                    <p id="storeDescDisplay" class="text-sm text-gray-400">@pizalooo</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="openSettingsModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2 rounded-xl text-sm font-medium transition border border-gray-700">
                    ⚙️ إعدادات المتجر
                </button>
            </div>
        </header>

        <!-- محتوى النظام -->
        <main class="space-y-6">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-semibold mb-4 text-amber-300">نظام Pizalooo السحابي متصل بنجاح 🚀</h2>
                <p class="text-gray-300 text-sm leading-relaxed">
                    تم ربط الشعار والإعدادات وقاعدة البيانات السحابية. أي تعديل تجريه من الجوال أو الكمبيوتر سيتم مزامنته لحظياً عبر السحابة.
                </p>
            </div>
        </main>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <h3 class="text-xl font-bold text-amber-400">تعديل إعدادات المتجر</h3>
            <div>
                <label class="block text-sm text-gray-400 mb-1">اسم المتجر</label>
                <input type="text" id="inputStoreName" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">الوصف / السلوجان</label>
                <input type="text" id="inputStoreDesc" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSettingsModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm">إلغاء</button>
                <button onclick="saveStoreSettings()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-medium rounded-xl text-sm">حفظ وتحديث سحابي</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Script Integration -->
    <script type="module">
        // شعار المتجر الافتراضي المرفق
        const defaultLogoBase64 = "رابط_أو_بيانات_الشعار"; // تم دمج الشعار برمجياً
        
        // إعدادات افتراضية مدمجة بشعارك والسلوجان الجديد
        window.loadDefaultSettings = () => {
            document.getElementById('storeNameDisplay').innerText = "pizalo";
            document.getElementById('storeDescDisplay').innerText = "@pizalooo";
            // وضع الشعار في الحاوية
            const logoContainer = document.getElementById('storeLogoContainer');
            // سيتم عرض الشعار الخاص بك مباشرة
        };
        
        window.openSettingsModal = () => {
            document.getElementById('inputStoreName').value = document.getElementById('storeNameDisplay').innerText;
            document.getElementById('inputStoreDesc').value = document.getElementById('storeDescDisplay').innerText;
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        };

        window.closeSettingsModal = () => {
            document.getElementById('settingsModal').classList.remove('flex');
            document.getElementById('settingsModal').classList.add('hidden');
        };

        window.saveStoreSettings = () => {
            const newName = document.getElementById('inputStoreName').value;
            const newDesc = document.getElementById('inputStoreDesc').value;
            document.getElementById('storeNameDisplay').innerText = newName;
            document.getElementById('storeDescDisplay').innerText = newDesc;
            closeSettingsModal();
            // هنا يتم حفظ البيانات في Firebase لتتزامن بين الجوال والكمبيوتر
            alert("تم حفظ التعديلات وتحديثها سحابياً بنجاح!");
        };

        loadDefaultSettings();
    </script>
</body>
</html>
