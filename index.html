<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizalooo - إدارة المبيعات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Parastoo & Rubik -->
    <link href="https://fonts.googleapis.com/css2?family=Parastoo:wght@400;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Parastoo', 'Rubik', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
        <!-- الهيدر المحدث مع شعارك الخاص -->
        <header class="flex flex-col sm:flex-row items-center justify-between bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-xl gap-4">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-amber-500 bg-gray-800 flex items-center justify-center shadow-md">
                    <span class="text-2xl">🍕</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-amber-400">pizalo</h1>
                    <p class="text-sm text-gray-400">@pizalooo</p>
                </div>
            </div>
            <div class="flex gap-2">
                <span class="bg-emerald-900/50 text-emerald-400 border border-emerald-700/50 px-4 py-2 rounded-xl text-sm font-medium">
                    🟢 النظام السحابي المتصل
                </span>
            </div>
        </header>

        <!-- محتوى النظام وجداولك الأساسية -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-lg space-y-4">
                <h2 class="text-lg font-semibold text-amber-300">لوحة التحكم والمبيعات</h2>
                <p class="text-gray-400 text-sm">هنا تظهر بياناتك، طلباتك، ومصاريفك بشكل كامل ومزامن.</p>
                <!-- مكان الجداول الخاصة بك -->
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm text-gray-300">
                        <thead class="bg-gray-800 text-amber-400 uppercase text-xs">
                            <tr>
                                <th class="p-3 rounded-r-xl">رقم الطلب</th>
                                <th class="p-3">العميل</th>
                                <th class="p-3">المبلغ</th>
                                <th class="p-3 rounded-l-xl">الحالة</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="border-b border-gray-800">
                                <td class="p-3">#101</td>
                                <td class="p-3">عميل تجريبي</td>
                                <td class="p-3">0.00 ر.س</td>
                                <td class="p-3 text-emerald-400">مكتمل</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- لوحة جانبية للإحصائيات أو الإدخال -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-lg space-y-4">
                <h3 class="text-lg font-semibold text-amber-300">إضافة طلب جديد</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">اسم العميل</label>
                        <input type="text" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="أدخل اسم العميل">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">المبلغ</label>
                        <input type="number" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="0.00">
                    </div>
                    <button class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2 rounded-xl text-sm transition shadow-lg">
                        حفظ الطلب
                    </button>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
